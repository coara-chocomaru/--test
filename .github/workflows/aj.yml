name: Sign OTA ZIP

on:
  workflow_dispatch:  # 手動トリガー

jobs:
  sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download signapk.jar
        run: |
          curl -o signapk.jar https://raw.githubusercontent.com/ndasjowo/SignApk/master/SignApk.jar

      - name: Sign the ZIP
        run: |
          java -jar signapk.jar -w testkey.x509.pem testkey.pk8 test2.zip signed_test.zip

      - name: Upload signed ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-ota-zip
          path: signed_test.zip
